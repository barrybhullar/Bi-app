[package]
name = "parsec-host-service"
version = "1.0.0"
edition = "2021"
description = "Ultra low-latency screen capture, hardware encoder and input service"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
webrtc = "0.11"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }

# Windows-specific dependencies (DXGI capture, Windows Service API)
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Direct3D11", "Win32_UI_WindowsAndMessaging"] }

# macOS-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
core-graphics = "0.24"

# Anti-Reverse Engineering / Anti-Tamper Hardening
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
